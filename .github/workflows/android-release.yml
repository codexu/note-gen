name: Android Release

on:
  push:
    branches:
      - test-android-action  # 在此分支推送时触发
  workflow_dispatch:  # 支持手动触发
    inputs:
      version:
        description: 'Version to build (optional)'
        required: false

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          echo "y" | sdkmanager "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: ${{ runner.os }}-cargo-android-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-android-

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build frontend
        run: pnpm build

      - name: Setup NDK toolchain
        run: |
          export PATH=$PATH:$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin
          ln -sf llvm-ranlib $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android-ranlib || true

      - name: Initialize and Build Android
        run: |
          export PATH=$PATH:$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin
          
          # Initialize Android project if not exists
          if [ ! -d "src-tauri/gen/android" ]; then
            echo "📱 Initializing Android project..."
            pnpm tauri android init
          else
            echo "✅ Android project already initialized"
          fi
          
          # Verify initialization
          if [ ! -d "src-tauri/gen/android" ]; then
            echo "❌ Android initialization failed"
            exit 1
          fi
          
          echo "🔨 Building Android APK and AAB..."
          pnpm tauri android build --apk --aab

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > src-tauri/android-release.keystore
          ls -la src-tauri/android-release.keystore

      - name: Sign APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd src-tauri
          if [ -f "gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk" ]; then
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA256 \
              -keystore android-release.keystore \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              -keypass "$ANDROID_KEY_PASSWORD" \
              gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk \
              note-gen
            echo "✅ APK signed successfully"
          else
            echo "❌ APK file not found"
            exit 1
          fi

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
          if-no-files-found: warn

      - name: Upload AAB as artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: src-tauri/gen/android/app/build/outputs/bundle/universalRelease/*.aab
          if-no-files-found: warn

      - name: Get version from tauri.conf.json
        id: get_version
        run: |
          VERSION=$(grep -o '"version": *"[^"]*"' src-tauri/tauri.conf.json | head -1 | sed 's/"version": *"\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: android-v${{ steps.get_version.outputs.version }}
          name: NoteGen Android v${{ steps.get_version.outputs.version }}
          body: |
            ## Android Release
            
            Download the APK file below to install on your Android device.
            
            ### Installation
            1. Download the APK file
            2. Enable "Install from Unknown Sources" in your device settings
            3. Install the APK
            
            ### Files
            - **APK**: Direct installation file
            - **AAB**: Google Play upload format
          draft: true
          prerelease: true
          files: |
            src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/universalRelease/*.aab

      - name: Cleanup keystore
        if: always()
        run: |
          rm -f src-tauri/android-release.keystore
