name: Plugin protocol compatibility
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'src-tauri/src/plugins.rs'
      - 'scripts/check-plugin-contract.py'
      - '.github/workflows/plugin-contract.yml'
  push:
    branches: [dev]
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'src-tauri/src/plugins.rs'
      - 'scripts/check-plugin-contract.py'
      - '.github/workflows/plugin-contract.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm plugin-api:check-version
