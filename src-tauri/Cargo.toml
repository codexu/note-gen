[package]
name = "note-gen"
version = "0.1.0"
description = "A Tauri App"
authors = ["codexu"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
tauri-utils = "2"

[dependencies]
tauri = { version = "2", features = [ "macos-private-api", "protocol-asset", "image-png", "devtools", "tray-icon" ] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "=1"
serde_json_canonicalizer = "0.3.2"
serde_yaml = "0.9"
tauri-plugin-store = "2"
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-dialog = "2"
tauri-plugin-http = { version = "=2.3.0", features = ["unsafe-headers"] }
tauri-plugin-os = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
urlencoding = "2.1.3"
percent-encoding = "2.3.0"
fuzzy-matcher = "0.3.7"
rayon = "1.8.0"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
reqwest = { version = "0.12", features = ["json", "multipart", "stream", "rustls-tls", "socks"] }
futures-util = "0.3"
url = "2.5"
reqwest_dav = "=0.2.1"
tauri-plugin-opener = "2.4.0"
tauri-plugin-clipboard-manager = "2"
uuid = { version = "1.10", features = ["v4", "v5"] }
zip = { version = "4", default-features = false, features = ["deflate"] }
sha2 = "0.10"
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
argon2 = "0.5"
hkdf = "0.12"
rand_core = { version = "0.6", features = ["getrandom"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"] }
base64 = "0.22"
anydoc = "=0.1.8"
unicode-normalization = "0.1"
ring = "0.17"
semver = "1"

[dependencies.tauri-plugin-sql]
features = ["sqlite"]
version = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
axum = "0.8"
tauri-plugin-deep-link = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
tauri-plugin-clipboard = "2"
xcap = "=0.6.0"
reqwest_dav = "=0.2.1"
tauri-plugin-process = "=2.0.0"
jieba-rs = { version = "0.7", features = ["textrank"] }
machine-uid = "0.5"
regex = "1"
font-kit = "0.14"
tauri-plugin-autostart = "=2.4.0"
trash = "=5.2.6"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
  "Foundation",
  "Foundation_Collections",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading"
] }

[target.'cfg(target_os = "android")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.23"
objc2-app-kit = { version = "0.3.1", default-features = false, features = ["NSPrintInfo", "NSPrintOperation", "NSResponder", "NSWindow"] }
objc2-web-kit = { version = "0.3.1", default-features = false, features = ["WKWebView", "objc2-app-kit"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2 = "0.6.1"
objc2-foundation = { version = "0.3.1", default-features = false, features = ["NSDictionary", "NSFileManager", "NSObject", "NSString", "NSURL"] }
objc2-store-kit = { version = "0.3.2", default-features = false, features = ["std", "SKPaymentQueue", "SKStorefront"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies.tauri]
version = "2"
features = []
